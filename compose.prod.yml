name: tutu-diff-prod

services:
  api:
    image: tutu-diff-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      TUTU_MCP_URL: ${TUTU_MCP_URL:-https://mcp.tutu.ru/mcp}
      HOST: 0.0.0.0
      PORT: 8787
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: tutu-diff-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      caddy:
        aliases:
          - tutu-diff-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  default:
  caddy:
    external: true
    name: granit-staging_default
