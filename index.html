<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Туту Разница — demo</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #23211f; background: #fff8f4; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 78% 8%, rgba(255,126,92,.42) 0, transparent 32%), radial-gradient(circle at 12% 88%, rgba(117,85,194,.18) 0, transparent 34%), linear-gradient(135deg, #fff5ee 0%, #fffaf7 44%, #f5eeff 100%); }
      main { align-items: center; display: grid; gap: clamp(40px, 6vw, 82px); grid-template-columns: minmax(300px, 380px) minmax(0, 680px); justify-content: center; margin: 0 auto; min-height: 100vh; padding: 32px; }
      .landing { align-self: center; }
      .eyebrow { color: #b35f4c; font-size: 11px; font-weight: 760; letter-spacing: .1em; text-transform: uppercase; }
      h1 { background: linear-gradient(130deg, #292522 8%, #9f3f30 58%, #6f4daf 100%); background-clip: text; color: transparent; font-size: clamp(44px, 5vw, 70px); letter-spacing: -.06em; line-height: .94; margin: 14px 0 20px; }
      .lead { color: #5f534e; font-size: 17px; line-height: 1.58; margin: 0 0 24px; max-width: 38ch; }
      .experience-tabs { background: rgba(255,255,255,.58); border: 1px solid rgba(71,45,35,.1); border-radius: 999px; display: inline-flex; gap: 4px; padding: 4px; }
      .experience-tabs button { background: transparent; border: 0; border-radius: 999px; color: #746762; cursor: pointer; font: inherit; font-size: 13px; font-weight: 680; padding: 9px 14px; }
      .experience-tabs button[aria-selected="true"] { background: #292522; color: #fff; }
      .demo-steps { margin-top: 20px; }
      .demo-steps[hidden] { display: none; }
      .demo-widget { width: 100%; }
      @media (max-width: 760px) { main { align-items: start; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 0; } .landing { width: 100%; } h1 { font-size: 44px; } .lead { margin-bottom: 18px; } .demo-widget { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <aside class="landing">
        <span class="eyebrow">Туту Разница</span>
        <h1>Сколько на самом деле стоит ваша поездка?</h1>
        <p class="lead">Намного больше, чем цифра на билете. Ночной рейс может потребовать такси до отеля, а долгая пересадка — отнять весь день. Вариант подороже часто оказывается выгоднее, если учесть все скрытые расходы и удобство маршрута.</p>
        <div class="experience-tabs" role="tablist" aria-label="Режим">
          <button type="button" role="tab" data-experience="scenario">Сценарий</button>
          <button type="button" role="tab" data-experience="live">Свой запрос</button>
        </div>
        <div class="demo-steps">
          <presentation-story-rail></presentation-story-rail>
        </div>
      </aside>
      <div class="demo-widget"></div>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
