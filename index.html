<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Туту Разница — demo</title>
    <style>
      :root {
        background: #fff8f4;
        color: #23211f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        max-width: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 78% 8%, rgba(255,126,92,.42) 0, transparent 32%),
          radial-gradient(circle at 12% 88%, rgba(117,85,194,.18) 0, transparent 34%),
          linear-gradient(135deg, #fff5ee 0%, #fffaf7 44%, #f5eeff 100%);
        scrollbar-width: none;
      }

      body::-webkit-scrollbar { display: none; }

      main {
        align-items: center;
        display: grid;
        gap: clamp(32px, 5vw, 72px);
        grid-template-columns: minmax(320px, 520px) minmax(340px, 430px);
        justify-content: center;
        margin: 0 auto;
        max-width: 1120px;
        height: 100dvh;
        min-width: 0;
        padding: 20px 32px;
      }

      .landing {
        align-self: center;
        min-width: 0;
      }

      h1 {
        background: linear-gradient(130deg, #292522 8%, #9f3f30 58%, #6f4daf 100%);
        background-clip: text;
        color: transparent;
        font-size: clamp(44px, 5vw, 70px);
        letter-spacing: -.06em;
        line-height: .94;
        margin: 0 0 20px;
      }

      .lead {
        color: #5f534e;
        font-size: 17px;
        line-height: 1.58;
        margin: 0 0 20px;
        max-width: 46ch;
      }

      .widget-stage {
        align-self: center;
        display: grid;
        justify-items: end;
        min-width: 0;
        width: 100%;
      }

      .demo-widget { width: 100%; }

      @media (max-width: 860px) {
        html,
        body { overflow-y: auto; }

        main {
          align-items: start;
          display: flex;
          flex-direction: column;
          gap: 24px;
          height: auto;
          min-height: 100dvh;
          padding: 24px 16px 28px;
        }

        .landing,
        .widget-stage,
        .demo-widget { width: 100%; }

        h1 { font-size: 44px; }
        .lead { margin-bottom: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <aside class="landing">
        <h1>Сколько на самом деле стоит ваша поездка?</h1>
        <p class="lead">Намного больше, чем цифра на билете. Лендинг объясняет контекст, а виджет справа остаётся коротким рабочим интерфейсом.</p>
        <presentation-landing-card></presentation-landing-card>
      </aside>
      <section class="widget-stage" aria-label="Минималистичный виджет Туту Разницы">
        <div class="demo-widget"></div>
      </section>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
